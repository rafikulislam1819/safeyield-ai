  workflow_dispatch:

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SafeYield AI Autopilot
        run: |
          curl -i -X POST "https://pjacpgpysrdnotdezxrh.supabase.co/functions/v1/ai-autopilot" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -d '{"sync_id":"rafikul-2026"}'
